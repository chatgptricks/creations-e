<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#ef7b30"><title>Creations E — A creative operating system</title><meta name="description" content="Welcome to Creations E. Explore E’s universe of design, digital products, websites, and experiments through a nostalgic interactive desktop."><link rel="icon" type="image/svg+xml" href="assets/icons/e-logo.svg"><link rel="preload" as="image" href="assets/wallpaper-dreamcore.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="windows.css"><link rel="stylesheet" href="explorer.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="dream.css"><link rel="stylesheet" href="classic-mac.css"><script type="module" src="app.js"></script></head>
<body>
<a class="skip-link" href="#desktop-icons">Skip to desktop projects</a>
<main class="desktop" id="desktop" aria-label="Creations E desktop">
  <div class="wallpaper" aria-hidden="true"></div><div class="wallpaper-vignette" aria-hidden="true"></div>
  <div class="dream-soft-focus" aria-hidden="true"></div>
  <div class="dream-atmosphere" aria-hidden="true">
    <div class="dream-bloom dream-bloom-sun"></div><div class="dream-bloom dream-bloom-low"></div><div class="dream-bloom dream-bloom-horizon"></div><div class="dream-shafts"></div>
    <div class="dream-bokeh-field"><i class="dream-bokeh"></i><i class="dream-bokeh"></i><i class="dream-bokeh"></i><i class="dream-bokeh"></i><i class="dream-bokeh"></i></div>
  </div>
  <div class="dream-vignette" aria-hidden="true"></div>
  <div class="desktop-icons" id="desktop-icons" role="group" aria-label="Desktop shortcuts"></div>
  <div id="window-layer" class="window-layer" aria-label="Application windows"></div>
  <div class="desktop-edition" aria-hidden="true">Creations E · System 2026<br>Made for curious minds</div>
  <div class="desktop-tip"><img src="assets/icons/e-logo.svg" alt=""><span><b>Your imagination has a desktop.</b><br>Double-click anything. Make yourself at home.</span><button aria-label="Dismiss desktop tip">×</button></div>
</main>
<section id="start-menu" class="start-menu mac-dropdown" aria-label="E menu" hidden>
  <button data-action="about"><b>About Creations E…</b><span>⌘ I</span></button><hr>
  <button data-action="explorer"><img src="assets/icons/folder.svg" alt="">My Creations</button>
  <button data-action="internet"><img src="assets/icons/globe.svg" alt="">The Internet</button>
  <button data-action="playground"><img src="assets/icons/paint.svg" alt="">3D Playground</button>
  <button data-action="programs" aria-expanded="false">All Creations<span>▶</span></button><hr>
  <button data-action="settings">Control Panels…</button>
  <button data-action="motion"><span id="start-motion-label">Pause motion</span></button><hr>
  <button data-action="restart">Restart…</button>
  <div id="programs-menu" class="programs-menu" hidden></div>
</section>
<div id="mac-menu" class="mac-dropdown mac-menu" aria-label="Desktop menu" hidden></div>
<div id="context-menu" class="context-menu" role="menu" hidden></div>
<div id="calendar-popup" class="calendar-popup" hidden></div>
<header class="taskbar" aria-label="Desktop menu bar">
  <button id="start-button" class="start-button" aria-label="Open E menu" aria-haspopup="true" aria-expanded="false"><img src="assets/icons/e-logo.svg" alt="E"></button>
  <nav class="mac-menus" aria-label="Finder menus"><button class="mac-finder-name" data-action="explorer">Finder</button><button data-mac-menu="file" aria-haspopup="true" aria-expanded="false">File</button><button data-mac-menu="view" aria-haspopup="true" aria-expanded="false">View</button><button data-mac-menu="special" aria-haspopup="true" aria-expanded="false">Special</button></nav>
  <div class="mac-bar-spacer"></div><span class="mac-edition">Orange edition</span>
  <button id="clock" aria-label="Date and time" aria-haspopup="true"></button>
  <button id="app-switcher-button" class="mac-app-switcher" data-app-switcher-trigger aria-label="Switch applications" aria-haspopup="true" aria-expanded="false"><img src="assets/icons/folder.svg" alt=""><span id="active-app">Finder</span><i aria-hidden="true">▾</i></button>
  <div id="window-menu" class="mac-dropdown mac-window-menu" aria-label="Open applications" hidden><div class="mac-menu-caption">Open applications</div><div id="task-list" class="task-list" aria-label="Open windows"></div><button data-action="show-desktop">Show Desktop</button></div>
</header>
<aside class="control-strip" aria-label="Control strip"><span class="control-strip-grip" aria-hidden="true"></span><div class="system-tray"><button data-action="settings" aria-label="Open Control Panels" title="Control Panels"><img src="assets/icons/settings.svg" alt=""></button><button id="motion-button" aria-label="Pause animations" title="Pause animations">✳</button><button id="sound-button" aria-label="Enable interface sounds" title="Enable interface sounds"><img src="assets/icons/audio.svg" alt=""><span class="sound-off">×</span></button></div><span class="control-strip-label">daydream on</span></aside>
<div class="boot-screen" id="boot-screen" aria-hidden="true"><div class="boot-logo"><img src="assets/icons/e-logo.svg" alt=""><span>Creations <b>E</b></span></div><p>Welcome to your imagination.</p><div class="boot-loader"><i></i><i></i><i></i></div><span class="boot-caption">Creations E · Orange edition</span></div>
<div class="desktop-toast" role="status" aria-live="polite"></div>
<noscript><div class="no-script">Creations E is an interactive portfolio. Please enable JavaScript to open the desktop and explore the projects.</div></noscript>
</body></html>
